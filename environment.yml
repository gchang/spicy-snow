# Readable list of dependencies. On Linux x86_64, conda-linux-64.lock is the same
# environment solved to exact packages and installs without a solver step:
#   conda create -n spicy --file conda-linux-64.lock
name: spicy
channels:
  - conda-forge
dependencies:
  - python>=3.9,<3.12
  - numpy
  - pandas
  - xarray
  - rioxarray
  - shapely
  - geopandas
  - asf_search
  - hyp3_sdk
  - matplotlib
  - netcdf4
  - rasterio
  - pyproj
  - earthaccess
  - pygeohydro
  - dask
  - zarr
  - h5py
  - tqdm
